# BTC Reflex Engine — Nixpacks Configuration
# Explicitly defines the start command so Railway never falls back
# to auto-detection (which guesses "python main.py" incorrectly).
#
# Project structure:
#   /app/          ← Railway container working directory
#   /app/app/      ← the actual Python package (app/)
#   /app/app/main.py
#
# Correct invocation: python -m app.main
# This runs app/main.py as a module, resolving all relative imports correctly.

[start]
cmd = "python -m app.main"
